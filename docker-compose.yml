services:
  db:
    image: postgres:17 # image: downloads and runs PostgreSQL version 17.
    container_name: expenses-sharing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: expenses_sharing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # volumes: preserves database data even if the container is removed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expenses_sharing"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: